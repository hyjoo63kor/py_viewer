[project]
name = "svg-viewer"
version = "0.2.0"
description = "PySide6 기반 데스크톱 이미지/문서 뷰어 애플리케이션"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7,<7",
    "PyMuPDF>=1.24,<2",
    "markdown>=3.7,<4",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "hypothesis>=6.115,<7",
    "pytest-qt>=4.4,<5",
    "PySide6-stubs>=6.7,<7",
    "pyinstaller>=6.11,<7",
]

[project.scripts]
app = "my_app.main:main"
clean = "my_app.clean:clean"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_app"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["my_app"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
